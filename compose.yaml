name: blog-writer-infra

services:
  db:
    image: postgres:18.6@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722
    environment:
      # Existing data directories keep initialized roles and databases when these values change.
      POSTGRES_USER: 'blog_writer'
      POSTGRES_PASSWORD: 'blog_writer'
    ports:
      - '127.0.0.1::5432'
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U blog_writer -d postgres']
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:
