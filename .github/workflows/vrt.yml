name: VRT

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  detect-changes-frontend:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    outputs:
      changed: ${{ steps.changes.outputs.any_modified }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for changes
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        id: changes
        with:
          files: |
            frontend/**
            .github/workflows/vrt.yml
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml

  capture-frontend:
    needs: detect-changes-frontend
    if: needs.detect-changes-frontend.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14

      # corepack creates the pnpm executable inside mise's node install
      # directory; reshim so the mise shims dir (which is on PATH) picks it up.
      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --filter "frontend..." --frozen-lockfile

      # project must match the `name` passed to createStorybookProject() in
      # vitest.screenshot.config.ts, and stay unique across every vrt_pkgs
      # entry -- vrt-capture's upload-artifact step names the artifact
      # `vrt-screenshots-<project>-<shard>`, and a workflow run can't upload
      # two artifacts with the same name.
      - uses: fohte/storybook-vrt-workflows/vrt-capture@e421864a67798d72cb0c12e48d5020ea0a8eee10 # v0.2.2
        with:
          project: storybook-screenshot-frontend
          shard: 1
          shards: 1
          capture-script: storybook:screenshot
          package-dir: frontend
          screenshots-dir: __screenshots__/desktop

  report-frontend:
    needs: capture-frontend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      statuses: write
    # Overlapping runs for the same ref would otherwise race to publish to
    # the same R2 key at once -- most importantly two main pushes racing to
    # update the single `baseline/actual/` key, where each run's diff was
    # computed against a baseline the other run is concurrently mutating.
    concurrency:
      group: vrt-report-frontend-${{ (github.ref == 'refs/heads/main') && 'push' || 'pr' }}-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          version: 2026.9.14

      - run: |
          corepack enable
          mise reshim

      - name: Get pnpm store directory
        id: pnpm-store
        run: |
          store_path=$(pnpm store path)
          echo "path=$store_path" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile

      # Only one `<project_name>-vrt` R2 bucket is provisioned per repo, and
      # vrt-report's storage keys (baseline/, branch/<branch>/) carry no
      # per-project segment -- if more than one vrt_pkgs entry exists, their
      # reports overwrite each other in this bucket. Keep vrt: true on a
      # single subpackage until fohte/storybook-vrt-workflows adds a key
      # prefix input.
      - uses: fohte/storybook-vrt-workflows/vrt-report@e421864a67798d72cb0c12e48d5020ea0a8eee10 # v0.2.2
        with:
          package-dir: frontend
          screenshots-dir: __screenshots__/desktop
          r2-bucket: blog-writer-vrt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
