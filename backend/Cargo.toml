[package]
name = "backend"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "=0.22.1"
axum = { version = "=0.8.9", features = ["multipart", "ws"] }
reqwest = { version = "=0.13.5", features = ["json", "stream"] }
scraper = "=0.24.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
rust-embed = { version = "=8.13.0", features = ["mime-guess"] }
thiserror = "=2.0.21"
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
utoipa = "=6.0.0"
utoipa-axum = "=0.3.0"
futures-util = "=0.3.34"
schemars = "=1.2.3"
sha2 = "=0.11.1"
tempfile = "=3.27.0"
encoding_rs = "=0.8.44"
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
webp = { version = "=0.3.1", default-features = false }
unicode-normalization = "=0.1.26"
dom_smoothie = "=0.19.0"
pdf_oxide = { version = "=0.3.78", default-features = false }
sqlx = { version = "=0.9.0", default-features = false, features = ["any", "macros", "migrate", "postgres", "runtime-tokio", "sqlite-bundled", "sqlx-toml", "tls-rustls"] }
tower-http = { version = "=0.6.11", features = ["cors"] }
yrs = { version = "=0.28.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "=1.54.1", features = ["test-util"] }
rstest = "=0.26.1"
indoc = "=2.0.8"
tower = { version = "=0.5.3", features = ["util"] }
wiremock = "=0.6.5"
tokio-tungstenite = "=0.28.0"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
disallowed_macros = "deny"
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
